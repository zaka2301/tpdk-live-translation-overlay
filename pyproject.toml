[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tpdk-overlay"
version = "0.1.0"
description = "Real-time lecture transcription, translation, and summary overlay (TPdK Kelompok 2)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Kelompok 2 TPdK" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "websockets>=13",
    "mss>=9.0",
    "soundcard>=0.4.3",
    "scipy>=1.13",
]

[project.optional-dependencies]
ui = ["PySide6>=6.8"]
# torch must be the CUDA build for GPU inference; scripts/bootstrap.ps1 installs
# it from https://download.pytorch.org/whl/cu130 before the extras.
ml = [
    "torch>=2.4",
    "transformers>=4.44,<5",
    "sentencepiece>=0.2",
    "silero-vad>=5.1",
]
ocr = [
    "paddlepaddle==3.2.0",
    "paddleocr>=3.7",
]
summarize = ["google-genai>=1.0"]
dev = [
    "flask>=3.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
tpdk-backend = "tpdk_overlay.server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tpdk_overlay"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
