# Runtime configuration. Schema: src/tpdk_overlay/config.py.
# Any key can be overridden by an environment variable TPDK__<SECTION>__<KEY>,
# e.g. TPDK__SERVER__PORT=9000 or TPDK__OCR__ENABLED=false.

app:
  data_dir: data
  log_level: INFO
  language:
    source: en      # ISO 639-1; Indonesian "id", English "en"
    target: id

server:
  host: 127.0.0.1
  port: 8765

audio:
  source: loopback        # loopback (system audio) | microphone
  input_device: null      # null = default output device for loopback, default mic otherwise
  sample_rate: 48000      # device capture rate; resampled to 16 kHz for ASR
  block_ms: 30
  vad:
    engine: silero
    threshold: 0.5
    min_speech_ms: 250
    min_silence_ms: 450
    max_utterance_ms: 12000  # hard subtitle cap; longer speech becomes a new segment
    pre_roll_ms: 300

asr:
  backend: llama_cpp           # llama_cpp = local llama serve (default here); http = vLLM in WSL
  base_url: http://127.0.0.1:8000  # http backend only; llama_cpp uses asr.llama_cpp.base_url
  model: Qwen/Qwen3-ASR-0.6B   # informational; the service (or llama serve) decides which weights are loaded
  language: null               # null = auto-detect; sent to the HTTP service; ignored by llama_cpp (always auto-detects)
  chunk_size_sec: 1.0          # vLLM streaming chunk; lower = faster partials, weaker accuracy
  unfixed_chunk_num: 4
  unfixed_token_num: 5
  timeout_s: 30
  llama_cpp:                   # used only when backend: llama_cpp
    # Separate llama serve process; start it before the backend (model + mmproj
    # auto-download on first run). scripts/serve_asr_llama.ps1 wraps this:
    #   llama serve -hf ggml-org/Qwen3-ASR-0.6B-GGUF:Q8_0 --host 127.0.0.1 --port 8081 `
    #     -ngl all -c 4096 -np 1 -n 128 --cache-type-k q8_0 --cache-type-v q8_0
    base_url: http://127.0.0.1:8081
    max_new_tokens: 128        # hard cap per request; partial previews use min(64, this)
    partial_interval_ms: 3000  # preview cadence
    partial_tail_sec: 0.0      # 0 = preview the whole utterance so far (cumulative); >0 = last N seconds only
    min_energy_dbfs: -40.0     # windows quieter than this never reach the server
    system_prompt: ""          # experimental; empty = no system message

mt:
  # Default: PLaMo-3-Translate 0.8B GGUF on the GPU, served by a local
  # `llama serve` process (start scripts\serve_mt_plamo.ps1 or use main.py).
  # nllb_ct2 = CTranslate2 int8 on CPU (zero VRAM); nllb = transformers fp16
  # GPU path, enabled with device: cuda.
  provider: plamo_llama
  model: facebook/nllb-200-distilled-600M
  device: cpu
  dtype: float16        # nllb only; CPU inference is forced to float32
  max_input_tokens: 512
  max_new_tokens: 256
  batch_size: 8
  translate_partials: true  # translate each source preview (finals still take priority)
  ct2:                  # used only when provider: nllb_ct2
    model: data/models/nllb-ct2
    compute_type: int8
    max_new_tokens: 256
  plamo_llama:          # used only when provider: plamo_llama
    base_url: http://127.0.0.1:8082
    model: plamo-translate          # llama serve --alias
    model_path: data/models/plamo-3-translate/plamo-3-translate-0.8b-Q4_K_M.gguf
    hf_model: pfnet/plamo-3-translate-0.8b-GGUF:Q4_K_M  # fallback when model_path is missing
    context_size: 16384
    max_new_tokens: 256
    timeout_s: 30
    concurrency: 8      # match the server's -np slot count

screen:
  enabled: true
  monitor: 1
  region: null            # {left, top, width, height} in physical pixels; null = pick in the UI
  capture_interval_ms: 1000
  change_threshold: 0.02  # fraction of pixels that must change to trigger OCR
  # Recording mode: keep the caption and slide overlay visible to OBS/screen
  # shares and hide them only around each OCR grab (brief blink when the slide
  # changes). Leave false to exclude both overlays from capture entirely.
  recording_mode: true

ocr:
  enabled: true
  device: gpu             # GPU small: ~0.4 s p50, ~0.7 GB peak; CPU fallback automatic
  enable_mkldnn: false    # oneDNN crashes on Paddle 3.3.x + PP-OCRv6 CPU; GPU ignores it
  det_model: PP-OCRv6_small_det
  rec_model: PP-OCRv6_small_rec
  min_confidence: 0.5
  max_blocks: 80
  block_gap_px: 18
  resize_max_side: 1280

summary:
  enabled: true
  provider: gemini
  model: gemini-3.5-flash-lite
  checkpoint_interval_s: 300
  api_key_env: GEMINI_API_KEY
  max_output_tokens: 2048
  temperature: 0.2
  timeout_s: 60
  min_request_interval_s: 4.5
  max_attempts: 3
  retry_base_s: 1.0
  retry_max_s: 20.0

ui:
  caption:
    width: 1200
    height: 300           # fits ~3-4 translation lines at the default font
    anchor: bottom-center
    opacity: 0.45
    font_family: Segoe UI
    font_size: 18
    translation_font_size: 18
    final_hold_ms: 3500     # minimum reading time for a translated final
  ocr_overlay:
    enabled: true
    background: "#101010"  # neutral graphite, matches ui/theme.py
    opacity: 0.70          # translucent: the original text stays visible
    font_family: Segoe UI
    font_scale: 0.9        # multiplier on the size derived from the source line
    max_font_px: 96        # guard against absurd heights from merged blocks
  click_through: true
  auto_start: true        # start the session as soon as the overlay connects
